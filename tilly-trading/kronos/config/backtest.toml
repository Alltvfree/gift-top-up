# Conservative default backtest configuration (Phase 29). Every value here
# can be overridden by a copy of this file, or by CLI flags on
# `python -m backtest` — nothing in the backtester is hardcoded elsewhere.
#
# These are deliberately conservative defaults, not tuned for the best-
# looking backtest number. TP/SL values match what the README's real
# training runs actually used for BTCUSDm (see kronos_model_btc_mtf_fixed.txt).

symbol = "BTCUSDm"
timeframe = "M5"
higher_timeframe = "H1"
initial_balance = 10000
currency = "USD"
random_seed = 42

[walk_forward]
train_days = 90
validation_days = 14
test_days = 14
step_days = 14
embargo_minutes = 60

[signal]
# Two INDEPENDENT thresholds for two independently-trained models (one per
# side — see backtest/walk_forward.py) — sell_threshold is NOT "1 minus
# buy_threshold" on a single probability. A live BTCUSDm run caught the bug
# in that older convention: it produced 641 SELL trades out of 643, none of
# them validated by an actual SELL-trained model.
buy_threshold = 0.60
sell_threshold = 0.60
cooldown_bars = 3
max_positions = 1
trade_buy = true
trade_sell = true

[risk]
mode = "percent_equity"
risk_percent = 1.0
fixed_money = 10.0
fixed_lot = 0.01
max_lot = 5.0

[stop_loss]
type = "points"
value = 20000   # BTCUSDm, point=0.01 -> 20000 * 0.01 = $200, matching the README's SL=200

[take_profit]
type = "points"
value = 30000   # 30000 * 0.01 = $300, matching the README's TP=300

[spread]
mode = "historical"   # use MT5's own recorded per-bar spread column
points = 3000
percent = 0.02

[slippage]
mode = "fixed_points"
points = 2.0
random_std_points = 1.0

[commission]
type = "per_lot"
value = 3.5

[execution]
next_bar = true
same_bar_exit_policy = "conservative"
max_holding_bars = 50
