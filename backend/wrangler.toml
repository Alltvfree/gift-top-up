name = "tilly-app-backend"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare account ID - replace with yours
# account_id = "YOUR_ACCOUNT_ID"

# Enable the default *.workers.dev subdomain for this Worker.
workers_dev = true

# Environment configuration
[env.production]
name = "tilly-app-backend-prod"
workers_dev = true

# Environment variables for production
[env.production.vars]
ENVIRONMENT = "production"
LOG_LEVEL = "info"

# Secrets (set via `wrangler secret put --env production`, or via the
# CI workflow which injects them from GitHub Actions secrets):
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# JWT_SECRET
# CORS_ORIGIN
