name: Deploy to Cloud (Supabase + Cloudflare)

on:
  push:
    branches:
      - deployment/supabase-cloudflare-pages
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy-cloud.yml'

  pull_request:
    branches:
      - deployment/supabase-cloudflare-pages

  # Manual trigger
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_APP_NAME: Tilly
          EXPO_PUBLIC_VERSION: 0.1.0

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: tilly-app
          directory: frontend/.expo/web
          branch: main
          wranglerVersion: '3'

  deploy-backend:
    name: Deploy Backend to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: []  # Can run in parallel

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Deploy to Cloudflare Workers
        working-directory: backend
        run: wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}

      - name: Run health check
        run: |
          sleep 5
          curl -f https://tilly-app-backend-prod.YOUR_ACCOUNT.workers.dev/health || exit 1
        continue-on-error: true

  notify:
    name: Notify on Deployment
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: always()

    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.deploy-frontend.result }}" == "success" ] && [ "${{ needs.deploy-backend.result }}" == "success" ]; then
            echo "✅ Deployment successful!"
            echo "Frontend: https://tilly-app.pages.dev"
            echo "Backend: https://tilly-app-backend-prod.YOUR_ACCOUNT.workers.dev"
          else
            echo "❌ Deployment failed!"
            exit 1
          fi
