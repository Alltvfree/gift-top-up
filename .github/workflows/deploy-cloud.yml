name: Deploy Backend to Cloud (Supabase + Cloudflare Workers)

# NOTE: The frontend is deployed separately by Cloudflare Pages' native
# Git integration (connected directly to this branch in the Cloudflare
# dashboard), which builds and deploys automatically on every push. This
# workflow only handles the backend, which needs its Worker secrets set
# explicitly (wrangler deploy does not read them from the CI env).

on:
  push:
    branches:
      - deployment/supabase-cloudflare-pages
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-cloud.yml'

  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Set Worker secrets
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.SUPABASE_URL }}" | npx wrangler secret put SUPABASE_URL --env production
          echo "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env production
          echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET --env production
          echo "${{ secrets.CORS_ORIGIN }}" | npx wrangler secret put CORS_ORIGIN --env production

      - name: Deploy to Cloudflare Workers
        working-directory: backend
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
