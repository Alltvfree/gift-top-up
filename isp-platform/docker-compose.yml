# Every host port comes from .env so this can sit next to other services on the same server.
# Only the web UI and RADIUS listen outside the host; the API is bound to loopback.
name: isp-platform
x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL}
  APP_SECRET_KEY: ${APP_SECRET_KEY}
  RADIUS_DB_PASSWORD: ${RADIUS_DB_PASSWORD}
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  AIRFIBER_OIDS: ${AIRFIBER_OIDS:-{}}
  POLL_INTERVAL_S: ${POLL_INTERVAL_S:-60}
  FOUR_EYES: ${FOUR_EYES:-true}
  # nginx's address range: X-Real-IP is trusted only from here (per-IP login throttling)
  TRUSTED_PROXY_NETS: ${DOCKER_SUBNET:-172.31.250.0/24}
  MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES:-admin}
  MFA_ISSUER: ${MFA_ISSUER:-SatLink}
  MSGOWL_ACCESS_KEY: ${MSGOWL_ACCESS_KEY:-}
  MSGOWL_SENDER_ID: ${MSGOWL_SENDER_ID:-SatLink}
  THREAT_AUTO_BLOCK: ${THREAT_AUTO_BLOCK:-true}
  THREAT_FAILURES: ${THREAT_FAILURES:-5}
  THREAT_WINDOW_MIN: ${THREAT_WINDOW_MIN:-30}
  THREAT_BLOCK_HOURS: ${THREAT_BLOCK_HOURS:-168}
  THREAT_SUBNET_AFTER: ${THREAT_SUBNET_AFTER:-3}
  THREAT_NEVER_BLOCK: ${THREAT_NEVER_BLOCK:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  PORTAL_URL: ${PORTAL_URL:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    environment: *app-env
    ports:
      - "127.0.0.1:${API_LOCAL_PORT:-8000}:8000"
    depends_on:
      db: { condition: service_healthy }
    networks: [private]

  # Polling + daily billing. Needs routes to every island's management network.
  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    networks: [private]

  # Telegram bot: change approvals (2FA code) and alerts. Outbound HTTPS to api.telegram.org only.
  telegram:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["python", "-m", "app.telegram_bot"]
    restart: unless-stopped
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    networks: [private]

  radius:
    build: { context: ., dockerfile: radius/Dockerfile }
    restart: unless-stopped
    environment:
      RADIUS_DB_PASSWORD: ${RADIUS_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${RADIUS_AUTH_PORT:-1812}:1812/udp"
      - "${RADIUS_ACCT_PORT:-1813}:1813/udp"
    depends_on: [api]   # api sets the radius role password on start
    networks: [private]

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-8443}   # used in the http -> https redirect
    ports:
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTP_PORT:-8081}:80"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on: [api]
    networks: [private]

volumes:
  postgres_data:
networks:
  private:
    driver: bridge
    # Pin the subnet so Docker never picks one that overlaps an island management range
    # (a clash makes those routers unreachable from the platform). Change if it collides.
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.31.250.0/24}
