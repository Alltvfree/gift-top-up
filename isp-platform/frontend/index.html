<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SatLink · Network Solution Partner</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="/app.css?v=20261029">
<script src="/vendor/qrcode.js" defer></script>
<script src="/app.js?v=20261029" defer></script>
</head>
<body>
<div id="login" class="login hidden">
  <form id="login-form" class="panel login-card" autocomplete="on">
    <img class="logo" src="/assets/satlink-logo.jpg" alt="SatLink Private Limited" width="720" height="202">
    <div class="subbrand">NETWORK SOLUTION PARTNER</div>
    <label>Username<input name="username" autocomplete="username" required maxlength="40"></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="200"></label>
    <button class="btn primary" type="submit">Sign in</button>
    <div id="login-error" class="error"></div>
  </form>
  <form id="mfa-form" class="panel login-card hidden" autocomplete="off">
    <img class="logo" src="/assets/satlink-logo.jpg" alt="SatLink Private Limited" width="720" height="202">
    <div class="subbrand">TWO-FACTOR SIGN-IN</div>
    <p class="muted">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
    <label>Code<input name="code" autocomplete="one-time-code" required maxlength="40" spellcheck="false"></label>
    <button class="btn primary" type="submit">Verify</button>
    <button class="link" type="button" id="mfa-back">Back to password</button>
    <div id="mfa-error" class="error"></div>
  </form>
</div>
<div id="app" class="hidden">
  <aside>
    <img class="logo" src="/assets/satlink-logo.jpg" alt="SatLink Private Limited" width="720" height="202">
    <div class="subbrand">NETWORK SOLUTION PARTNER</div>
    <nav id="nav"></nav>
    <div class="me"><span id="me"></span><button class="link" id="logout">Sign out</button></div>
  </aside>
  <main>
    <div class="top">
      <div><div class="muted">Operations / <span id="crumb"></span></div><h1 id="title"></h1></div>
      <span class="pill" id="connection">● Connecting</span>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-body panel"><button class="link close" id="modal-close">✕</button><div id="modal-content"></div></div></div>
<div id="toast" class="toast hidden"></div>
</body>
</html>
